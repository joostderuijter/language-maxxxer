# language-maxxer on the home server: /srv/language-maxxer, behind Caddy at https://lm.joost.im (Tailscale only,
# no auth yet: never expose publicly). Deployed with scripts/deploy.sh.
services:
  language-maxxer:
    build: .
    container_name: language-maxxer
    restart: unless-stopped
    env_file: .env                # LMX_JELLYFIN_API_KEY (read-only use: list episodes, watch status)
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
      LMX_DATA_DIR: /data
      LMX_JELLYFIN_URL: http://jellyfin:8096
    volumes:
      - ./data:/data
      # media at the same paths Jellyfin sees them, READ-ONLY: language-maxxer never changes your library
      - /mnt/content1/torrent:/media/torrent:ro
      - /mnt/content1/youtube:/media/youtube:ro
    networks: [caddy]
    labels:
      caddy: lm.joost.im
      caddy.reverse_proxy: "{{upstreams 8000}}"
      caddy.tls: internal

networks:
  caddy:
    external: true
