[project]
name = "language-maxxer"
version = "0.1.0"
description = "Self-hosted immersion language learning: content at your level, progress, Anki."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
    "sqlalchemy>=2.0.40",
    "alembic>=1.16",
    "pydantic-settings>=2.10",
    "kiwipiepy>=0.25.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.0",
    "hypothesis>=6.140",
    "httpx>=0.28",
    "ruff>=0.14",
    "pyright>=1.1.405",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lmx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["src/lmx"]
omit = ["src/lmx/__main__.py", "src/lmx/migrations/*"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
